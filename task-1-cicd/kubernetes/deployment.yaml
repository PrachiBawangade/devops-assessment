apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-assessment-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-assessment-app
  template:
    metadata:
      labels:
        app: devops-assessment-app
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: devops-assessment-app
          image: 635930436969.dkr.ecr.ap-south-1.amazonaws.com/devops-assessment-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
