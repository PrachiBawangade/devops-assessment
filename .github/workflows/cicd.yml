name: DevOps Assessment CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: devops-assessment-pipeline
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "635930436969"
  ECR_REGISTRY: 635930436969.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: devops-assessment-app

jobs:

  # CI: TEST, BUILD AND PUSH DOCKER IMAGE

  build-and-push:

    name: CI - Test, Build and Push to ECR

    runs-on: ubuntu-latest

    timeout-minutes: 20

    permissions:
      contents: read

    steps:

      # Checkout source code

      - name: Checkout source code
        uses: actions/checkout@v4

      # Setup Node.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: task-1-cicd/app/package-lock.json

      # Install dependencies

      - name: Install dependencies
        working-directory: task-1-cicd/app
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      # Run application tests

      - name: Run application tests
        working-directory: task-1-cicd/app
        shell: bash
        run: |
          set -euo pipefail
          npm test

      # Configure AWS credentials

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Check whether ECR repository exists

      - name: Check or create ECR repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ECR repository..."

          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            >/dev/null 2>ecr-error.log; then

            echo "ECR repository already exists."
            echo "Skipping repository creation."

          else

            if grep -q "RepositoryNotFoundException" ecr-error.log; then

              echo "ECR repository does not exist."
              echo "Creating repository..."

              aws ecr create-repository \
                --repository-name "$ECR_REPOSITORY" \
                --image-scanning-configuration scanOnPush=true \
                --encryption-configuration encryptionType=AES256 \
                --region "$AWS_REGION"

              echo "ECR repository created successfully."

            else

              cat ecr-error.log >&2
              echo "Unable to check ECR repository." >&2
              exit 1

            fi

          fi

          rm -f ecr-error.log

      # Login to Amazon ECR

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image

      - name: Build Docker image
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building Docker image: $IMAGE"

          docker build \
            --pull \
            --tag "$IMAGE" \
            ./task-1-cicd

      # Push Docker image to ECR

      - name: Push Docker image to ECR
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Pushing Docker image: $IMAGE"

          docker push "$IMAGE"

          echo "Docker image pushed successfully."

  # CD: DEPLOY APPLICATION USING HELM

  deploy-to-kubernetes:
    name: CD - Deploy using Helm
    needs: build-and-push
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:

      # Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify required tools
      - name: Debug tool availability
        shell: bash
        run: |
         echo "Checking Git Bash environment..."
         echo "PATH: $PATH"

         for tool in aws kubectl helm minikube; do
          echo "--------------------------------"
          echo "Checking $tool"

          if command -v "$tool"; then
          echo "$tool is available."
            else
             echo "ERROR: $tool is missing from PATH."
          fi
          done

      # Verify Minikube connection
      - name: Verify Kubernetes connection
        run: |
          set -euo pipefail

          minikube status
          kubectl config use-context minikube
          kubectl get nodes

          echo "Kubernetes connection verified."

      # Create or update ECR image pull secret
      - name: Create or update ECR pull secret
        run: |
          set -euo pipefail

          PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")

          if [ -z "$PASSWORD" ]; then
            echo "ERROR: Unable to authenticate with ECR."
            exit 1
          fi

          kubectl create secret docker-registry ecr-registry-secret \
            --docker-server="$ECR_REGISTRY" \
            --docker-username=AWS \
            --docker-password="$PASSWORD" \
            --dry-run=client -o yaml |
          kubectl apply -f -

          unset PASSWORD

          echo "ECR pull secret is ready."

      # Validate Helm chart
      - name: Validate Helm chart
        run: |
          set -euo pipefail

          helm lint ./helm/devops-assessment

          echo "Helm chart validation successful."

      # Deploy application using Helm
      - name: Deploy application using Helm
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Deploying image: $IMAGE"

          helm upgrade --install devops-assessment \
            ./helm/devops-assessment \
            --namespace default \
            --set-string image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 180s

          echo "Helm deployment completed."

      # Verify Kubernetes deployment
      - name: Verify Kubernetes deployment
        run: |
          set -euo pipefail

          kubectl rollout status deployment/devops-assessment \
            --namespace default \
            --timeout=180s

          echo "Deployment verification successful."

          kubectl get deployments
          kubectl get pods
          kubectl get services

      # Verify Helm release
      - name: Verify Helm release
        run: |
          set -euo pipefail

          helm status devops-assessment --namespace default

          echo "Helm release verified successfully."